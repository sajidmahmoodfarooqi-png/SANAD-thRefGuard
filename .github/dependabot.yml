version: 2
updates:
  # Python Core dependencies
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  # GitHub Actions used by CI / release
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies"]

  # Electron desktop app
  - package-ecosystem: npm
    directory: "/app"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  # Word add-in (dev tooling)
  - package-ecosystem: npm
    directory: "/connectors/word"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
