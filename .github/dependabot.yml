version: 2
updates:
  # Python Core dependencies — one grouped PR per month, not one per package.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    groups:
      python-deps:
        patterns: ["*"]
    labels: ["dependencies"]

  # GitHub Actions used by CI / release
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    labels: ["dependencies"]

  # Electron desktop app
  - package-ecosystem: npm
    directory: "/app"
    schedule:
      interval: monthly
    groups:
      app-deps:
        patterns: ["*"]
    labels: ["dependencies"]

  # Word add-in (dev tooling)
  - package-ecosystem: npm
    directory: "/connectors/word"
    schedule:
      interval: monthly
    groups:
      addin-deps:
        patterns: ["*"]
    labels: ["dependencies"]
