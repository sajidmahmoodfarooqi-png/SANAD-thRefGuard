name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }} · py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest -q

  freeze:
    name: Freeze Core binary (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build standalone Core
        run: python packaging/build_core.py
      - name: Smoke-test the frozen Core
        shell: bash
        run: |
          # The Core is a folder: the program plus its support files in _internal/.
          DIR=packaging/dist/sanad-core
          BIN="$DIR/sanad-core"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          test -f "$BIN" || { echo "frozen Core program missing: $BIN"; exit 1; }
          test -d "$DIR/_internal" || { echo "support folder missing: $DIR/_internal"; exit 1; }
          echo "built: $DIR ($(du -sh "$DIR" | cut -f1))"
          # Start it on a spare port with a throw-away library and wait for it to
          # answer — a missing support file only shows up when it actually runs.
          export SANAD_PORT=23897 SANAD_TOKEN=ci-smoke-test
          export SANAD_DB="$RUNNER_TEMP/sanad-smoke.db"
          "$BIN" > "$RUNNER_TEMP/sanad-core.log" 2>&1 &
          PID=$!
          OK=0
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:$SANAD_PORT/v1/health" 2>/dev/null | grep -q '"status" *: *"ok"'; then
              OK=1; echo "Core answered /v1/health after about ${i}s"; break
            fi
            kill -0 "$PID" 2>/dev/null || { echo "Core exited before answering"; break; }
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          if [ "$OK" != 1 ]; then
            echo "::error::frozen Core did not answer /v1/health"
            cat "$RUNNER_TEMP/sanad-core.log"
            exit 1
          fi
      - name: Upload Core artifact
        uses: actions/upload-artifact@v7
        with:
          name: sanad-core-${{ matrix.os }}
          path: packaging/dist/sanad-core/
          if-no-files-found: error
