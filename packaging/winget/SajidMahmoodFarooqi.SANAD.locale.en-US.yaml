ShortDescription: Local-first citation companion for Word — checks that each citation is actually right, and never touches your prose.
Description: |-
  SANAD (the RefGuard) is a free, open-source, local-first citation companion for Microsoft Word
  and LibreOffice. Beyond formatting, it checks whether each citation is actually right — the right
  source, the right year, cited in the right place (integrity rules R1–R8) — and it only ever writes
  inside its own citation and bibliography fields, never your prose. Everything runs on your own
  machine on 127.0.0.1 with no account, no cloud, and no telemetry.
